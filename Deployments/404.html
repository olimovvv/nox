<html lang="en">
<head>

<style>
/* Same tokens as the app — this page must feel like Nox, not like a server error. Self-contained so
   it renders even if the main bundle never loads (which is often WHY someone lands here). */
:root{--bg:#0c0c0c;--s1:#141414;--s2:#1c1c1c;--s3:#242424;--t1:#f0f0f0;--t2:#888;--t-cap:#7d7d7d;
  --acc:#4ade80;--acc-d:#071a0e;--bd2:rgba(255,255,255,.14);--moon-base:#b4b4b4;
  --ease-out:cubic-bezier(0.16,1,0.3,1);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:flex-start;padding:0 clamp(24px,7vw,96px);
  position:relative;overflow:hidden;}
/* the moon is the anchor — same carved-stone build as the app (border-radius disc + one mask bite,
   never mask-composite, so the silhouette can't break into a rectangle) */
.moon{position:absolute;top:38%;left:66%;transform:translate(-50%,-50%);
  width:min(560px,120vw);height:min(560px,120vw);pointer-events:none;border-radius:50%;
  background-color:var(--moon-base);
  background-image:
    radial-gradient(78% 78% at 30% 24%,rgba(255,255,255,.16),rgba(255,255,255,0) 58%),
    radial-gradient(96% 96% at 74% 80%,rgba(0,0,0,.30),rgba(0,0,0,0) 62%),
    radial-gradient(38% 38% at 58% 46%,rgba(255,255,255,.05),rgba(255,255,255,0) 60%);
  box-shadow:inset 6px 7px 34px rgba(0,0,0,.34),inset 3px 4px 1px rgba(255,255,255,.10);
  -webkit-mask-image:radial-gradient(circle at 72% 26%,rgba(0,0,0,0) 46%,#000 46.9%);
  mask-image:radial-gradient(circle at 72% 26%,rgba(0,0,0,0) 46%,#000 46.9%);
  filter:drop-shadow(0 0 14px rgba(255,255,255,.07)) drop-shadow(0 0 46px rgba(255,255,255,.035));
  animation:breathe 9s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.015);}}
.wrap{position:relative;z-index:1;max-width:min(560px,90vw);animation:up .7s var(--ease-out) both;}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.code{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t-cap);margin-bottom:18px;}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(38px,8vw,68px);font-weight:300;line-height:.97;
  letter-spacing:-.032em;margin:0 0 20px;}
h1 .dim{color:#6a6a6a;display:block;}
p{font-size:16px;line-height:1.6;color:var(--t2);max-width:400px;margin:0 0 32px;}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:var(--acc-d);
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;text-decoration:none;
  padding:12px 28px;border-radius:10px;border:none;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.15),0 4px 16px -4px rgba(74,222,128,.55);
  transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out);}
.btn:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.18),0 10px 26px -4px rgba(74,222,128,.66);}
.btn:active{transform:translateY(0) scale(.985);}
.btn:focus-visible{outline:2px solid rgba(74,222,128,.55);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){.moon,.wrap{animation:none;}.btn{transition:none;}}
</style>
</head>

<div class="moon" aria-hidden="true"></div>
<main class="wrap">
  <div class="code">Error 404</div>
  <h1>lost in<span class="dim">the dark.</span></h1>
