<style>
:root{
  --bg:#0c0c0c;--s1:#141414;--s2:#1a1a1a;--bd:#232323;--bd2:#2c2c2c;
  --t1:#f0f0f0;--t2:#a8a8a8;--t-cap:#7d7d7d;--acc:#52D1A4;
}
html.light{
  --bg:#efe6d3;--s1:#f7f0e2;--s2:#f2e9d8;--bd:#ded2b8;--bd2:#d3c5a6;
  --t1:#231e13;--t2:#4a4234;--t-cap:#6e644e;--acc:#147150;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--t1);
  font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.72;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding:0 22px 90px;
}
.wrap{max-width:720px;margin:0 auto;}
nav{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:22px 0;border-bottom:.5px solid var(--bd);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--t1);}
.brand span{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:500;letter-spacing:-.01em;}
.ctrl{display:flex;gap:6px;align-items:center;}
.ctrl button{
  background:var(--s1);border:.5px solid var(--bd2);color:var(--t2);
  font-family:'Inter',sans-serif;font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background-color .18s ease;
}
.ctrl button:hover{color:var(--t1);}
.ctrl button.on{color:var(--acc);border-color:var(--acc);}
header{padding:52px 0 30px;}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,6vw,46px);font-weight:700;line-height:1.05;letter-spacing:-.025em;text-wrap:balance;}
.upd{font-size:12px;color:var(--t-cap);margin-top:12px;font-variant-numeric:tabular-nums;}
.lede{font-size:16.5px;color:var(--t2);margin-top:18px;max-width:58ch;text-wrap:pretty;}
h2{
  font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:500;
  letter-spacing:-.012em;margin:42px 0 12px;text-wrap:balance;
}
p{margin-bottom:14px;color:var(--t2);text-wrap:pretty;}
p strong,li strong{color:var(--t1);font-weight:500;}
ul{margin:0 0 16px 0;padding-left:0;list-style:none;}
li{position:relative;padding-left:18px;margin-bottom:9px;color:var(--t2);text-wrap:pretty;}
li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--bd2);}
.callout{
  background:var(--s1);border:.5px solid var(--bd2);border-left:2px solid var(--acc);
  border-radius:0 10px 10px 0;padding:16px 18px;margin:18px 0;
}
.callout p:last-child{margin-bottom:0;}
.todo{border-left-color:#e0a33a;}
a{color:var(--acc);}
footer{margin-top:56px;padding-top:22px;border-top:.5px solid var(--bd);font-size:12.5px;color:var(--t-cap);}
footer a{color:var(--t2);text-decoration:none;border-bottom:.5px solid var(--bd2);}
footer a:hover{color:var(--acc);border-bottom-color:var(--acc);}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

let L = (localStorage.getItem("nox_lang") || "en");
if(!DOC[L]) L = "en";

function render(){
  const d = DOC[L];
  document.documentElement.lang = L;
  document.title = d.title + " — Nox";
  document.getElementById("back").textContent = d.back;
  ["en","uz","ru"].forEach(x => document.getElementById("l-"+x).classList.toggle("on", x === L));
  document.getElementById("doc").innerHTML =
    '<header><h1>' + d.title + '</h1><div class="upd">' + d.upd + '</div>'
    + '<p class="lede">' + d.lede + '</p></header>'
    + '<div class="callout"><p><strong>' + d.hero + '</strong></p></div>'
    + d.s.map(sec =>
        '<h2>' + sec[0] + '</h2><ul>' + sec[1].map(li => '<li>' + li + '</li>').join("") + '</ul>'
      ).join("")
    + '<h2>' + d.contact_h + '</h2><p>' + d.contact_p
    + ' <a href="mailto:' + CONTACT_EMAIL + '">' + CONTACT_EMAIL + '</a></p>';
  // the address appears mid-sentence in one bullet too; fill it after the HTML exists
  document.querySelectorAll("#doc .mail").forEach(el => {
    el.innerHTML = '<a href="mailto:' + CONTACT_EMAIL + '">' + CONTACT_EMAIL + '</a>';
  });
}
function setL(x){ L = x; try{ localStorage.setItem("nox_lang", x); }catch(e){} render(); }
function setT(){
  const light = document.documentElement.classList.toggle("light");
  document.body.classList.toggle("light", light);
  try{ localStorage.setItem("nox_theme", light ? "light" : "dark"); }catch(e){}
  document.getElementById("thm").textContent = light ? "☾" : "☀︎";
}
(function(){
  let saved = null;
  try{ saved = localStorage.getItem("nox_theme"); }catch(e){}
  if(saved === "light"){
    document.documentElement.classList.add("light");
    document.body.classList.add("light");
    document.getElementById("thm").textContent = "☾";
  }
  render();
})();
</script>
